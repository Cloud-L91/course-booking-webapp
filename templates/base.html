<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title> {% block title %} Cooking School {% endblock %} </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/authentication.css') }}">

</head>

<body class="d-flex flex-column min-vh-100" style="overflow-x: hidden; font-family: Verdana, Geneva, Tahoma, sans-serif;">

    <header class="sticky-top py-2 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center">
                <a href="{{ url_for('home') }}" class="d-flex align-items-center me-3 text-white text-decoration-none">
                    <img class="site-logo rounded-circle" width="50" height="50"
                        src="{{ url_for('static', filename='img/logos/placeholder_logo.jpg') }}"
                        alt="Cooking School logo">
                </a>
                <ul class="nav me-auto mb-2 mb-md-0">
                    <li><a href="{{ url_for('home') }}" class="nav-link px-2 text-white">Home</a></li>
                    <li><a href="#" class="nav-link px-2 text-secondary">About</a></li>
                </ul>
                <div class="col-md-3 text-end">
                    <a href="{{ url_for('login') }}" type="button" class="btn btn-primary me-2">Login</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>


    <footer class="text-bg-dark py-3 mt-auto">
        <div class="container">
            <div class=" d-flex flex-wrap justify-content-between align-items-center">
                <div class="col-md-4 d-flex align-items-center mx-4">
                    <a href="{{ url_for('home') }}"
                        class="d-flex align-items-center me-3 text-white text-decoration-none">
                        <img class="site-logo rounded-circle" width="50" height="50"
                            src="{{ url_for('static', filename='img/logos/placeholder_logo.jpg') }}" alt="">
                    </a>
                    <span class="text-body-primary">© 2025 Company, Inc</span>
                </div>

                <ul class="nav col-md-4 justify-content-end list-unstyled d-flex mx-4">
                    <li class="ms-3">
                        <a class="text-body-secondary" href="#" aria-label="Shinra Inc">
                            <img src="{{ url_for('static', filename='img/logos/shinra_logo.jpg') }}" alt="Shinra Inc"
                                width="35" height="35">
                        </a>
                    </li>
                    <li class="ms-3">
                        <a class="text-body-secondary" href="#" aria-label="Fox Hound">
                            <img src="{{ url_for('static', filename='img/logos/fox_hound_logo.jpg') }}" alt="Fox Hound"
                                width="35" height="35">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>

</body>

</html>
