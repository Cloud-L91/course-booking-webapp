{% extends "base.html" %}

{% block title %}
The cake is a lie - Create class
{% endblock %}

{% block content %}
<section class="form-card">
    <div class="register-box register-class">
        <form class="form-signin w-100 m-auto" method="POST" action="{{ url_for('create_class') }}" enctype="multipart/form-data">

            <h1 class="mb-3 fw-normal">New class</h1>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
            {% endif %}

            <div class="col-12 mb-3">
                <label for="title">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="row g-3">
                <div class="col-md-6 mb-3">
                    <label for="cuisine">Cuisine</label>
                    <input type="text" class="form-control" id="cuisine" name="cuisine" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="chef_name">Chef</label>
                    <div class="input-group"><input type="text" class="form-control" id="chef_name" name="chef_name" required></div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty" name="difficulty" class="form-select" required>
                        <option value="" selected disabled>Choose...</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="duration">Duration (minutes)</label>
                    <input type="number" class="form-control" id="duration" name="duration" min="30" max="240" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="dietary_category">Dietary category</label>
                    <select id="dietary_category" name="dietary_category" class="form-select" required>
                        <option value="" selected disabled>Choose...</option>
                        <option value="Standard">Standard</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Vegan">Vegan</option>
                        <option value="Gluten-free">Gluten-free</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label d-block fw-bold">Ingredients</label>
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#ingredientsModal">
                    <i class="bi bi-list-ul me-1"></i> Add / Edit Ingredients
                </button>
            </div>

            <div class="modal fade" id="ingredientsModal" tabindex="-1" aria-labelledby="ingredientsModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title" id="ingredientsModalLabel">Insert Ingredients</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">

                            <div class="mb-3">
                                <p class="text-muted small mb-2">Write one ingredient per line (minimum 4):</p>
                                <textarea class="form-control" id="ingredients" name="ingredients" rows="8"></textarea>
                            </div>

                        </div>
                        <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button></div>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <div class="mb-3">
                    <div class="mb-3">
                        <label for="photo_1">First photo</label>
                        <input class="form-control" type="file" id="photo_1" name="photo_1" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="photo_2">Second photo</label>
                        <input class="form-control" type="file" id="photo_2" name="photo_2" accept="image/*" required>
                    </div>
                    <div class="mb-4">
                        <label for="photo_3">Third photo</label>
                        <input class="form-control" type="file" id="photo_3" name="photo_3" accept="image/*" required>
                    </div>

                    <button class="btn btn-primary py-2" type="submit">Send</button>
                    <button class="btn btn-secondary py-2" type="reset">Clear</button>
                </div>
            </div>
        </form>
    </div>
</section>
{% endblock %}
